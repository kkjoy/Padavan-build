name: 红米AC2100-KVR-WING-SmartDNS-WebUI

on:
  workflow_dispatch:

# ============================================================
# 配置说明 (请根据你的 Padavan 固件类型选择):
#
# ★ libc 选择 (关键!)
#   - glibc (默认): 大多数 Padavan 官方固件使用 glibc
#     → Rust 目标: mipsel-unknown-linux-gnu
#     → 交叉编译器: mipsel-linux-gnu-gcc
#   - musl: 部分 musl-based Padavan (如 arrshavin/padavan)
#     → Rust 目标: mipsel-unknown-linux-musl
#     → 需要额外的 musl 交叉编译器 (musl-gcc 等)
#
# ★ SmartDNS 版本: Release48.4
# ★ WebUI 版本: v1.0.0
# ★ OpenSSL 版本: 3.4.0 (静态链接)
# ★ 目标架构: mipsel (MT7621/MT7620/MT7628)
#
# 产物结构:
#   bin/smartdns              - 主 DNS 程序 (静态链接 OpenSSL)
#   lib/smartdns_ui.so        - WebUI Rust 后端插件
#   wwwroot/                  - WebUI 前端静态文件 (Next.js)
#   etc/smartdns/smartdns.conf - 配置文件模板
# ============================================================

# ============================================================
# Job 1: 预编译 OpenSSL 3.4.0 (MIPS 交叉编译)
# ============================================================
jobs:
  build-openssl:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact }}

    steps:
    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install -qq \
          gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
          libc6-dev-mipsel-cross binutils-mipsel-linux-gnu \
          build-essential curl wget tar perl

    - name: 构建 OpenSSL 3.4.0 for MIPS
      run: |
        cd /tmp
        curl -sL -o openssl-3.4.0.tar.gz "https://www.openssl.org/source/openssl-3.4.0.tar.gz"
        tar zxf openssl-3.4.0.tar.gz
        cd openssl-3.4.0
        ./Configure linux-mips32 \
          --prefix=/opt/openssl-mipsel \
          --cross-compile-prefix=mipsel-linux-gnu- \
          no-shared no-dso no-tests no-apps no-docs
        make -j$(nproc)
        make install_sw

        echo "=== OpenSSL 构建产物 ==="
        ls -la /opt/openssl-mipsel/lib/
        ls -la /opt/openssl-mipsel/include/openssl/ | head -20

        # 打包 OpenSSL
        mkdir -p /tmp/openssl-package
        cp -r /opt/openssl-mipsel /tmp/openssl-package/

    - name: 上传 OpenSSL 构建产物
      id: upload
      uses: actions/upload-artifact@master
      with:
        name: openssl-mipsel-3.4.0
        path: /tmp/openssl-package/
        retention-days: 7

  # ============================================================
  # Job 2: 预编译 SmartDNS 主程序 + libsmartdns-test.a
  # ============================================================
  build-smartdns:
    runs-on: ubuntu-latest
    needs: build-openssl
    outputs:
      artifact: ${{ steps.upload.outputs.artifact }}

    steps:
    - name: 下载 OpenSSL 产物
      uses: actions/download-artifact@master
      with:
        name: openssl-mipsel-3.4.0
        path: /tmp/openssl-package/

    - name: 安装 MIPS 工具链
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install -qq \
          gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
          libc6-dev-mipsel-cross binutils-mipsel-linux-gnu \
          build-essential curl wget tar

    - name: 下载并构建 SmartDNS Release48.4
      run: |
        export OPENSSL=/tmp/openssl-package/openssl-mipsel

        cd /tmp
        curl -sL -o smartdns-Release48.4.tar.gz \
          "https://codeload.github.com/pymumu/smartdns/tar.gz/refs/tags/Release48.4"
        tar zxf smartdns-Release48.4.tar.gz
        cd smartdns-Release48.4/src

        # 构建 smartdns 主二进制
        make CC=mipsel-linux-gnu-gcc \
             AR=mipsel-linux-gnu-ar \
             STATIC=yes \
             EXTRA_CFLAGS="-I${OPENSSL}/include -DOPENSSL_SUPPRESS_DEPRECATED -DOPENSSL_API_COMPAT=0x30000000L" \
             EXTRA_LDFLAGS="-L${OPENSSL}/lib -static" \
             CFLAGS="-O2 -Wall -Wno-error -I${OPENSSL}/include -DOPENSSL_SUPPRESS_DEPRECATED -DOPENSSL_API_COMPAT=0x30000000L"

        # 验证主程序
        echo "=== SmartDNS 主程序信息 ==="
        file smartdns
        mipsel-linux-gnu-strings smartdns | grep "OpenSSL" | head -3

        # 构建 libsmartdns-test.a (WebUI 插件需要此静态库)
        echo "=== 构建 libsmartdns-test.a ==="
        make WITH_ZLIB=0 -B libsmartdns-test.a
        ls -la libsmartdns-test.a

        # 打包
        mkdir -p /tmp/smartdns-package
        cp smartdns /tmp/smartdns-package/
        cp libsmartdns-test.a /tmp/smartdns-package/

    - name: 上传 SmartDNS 产物
      id: upload
      uses: actions/upload-artifact@master
      with:
        name: smartdns-mipsel-Release48.4
        path: /tmp/smartdns-package/
        retention-days: 7

  # ============================================================
  # Job 3: 预编译 smartdns-ui Rust 插件 (交叉编译 .so)
  # ============================================================
  build-smartdns-ui:
    runs-on: ubuntu-latest
    needs: [build-openssl, build-smartdns]
    outputs:
      artifact: ${{ steps.upload.outputs.artifact }}

    steps:
    - name: 下载 OpenSSL 产物
      uses: actions/download-artifact@master
      with:
        name: openssl-mipsel-3.4.0
        path: /tmp/openssl-package/

    - name: 下载 SmartDNS 产物 (含 libsmartdns-test.a)
      uses: actions/download-artifact@master
      with:
        name: smartdns-mipsel-Release48.4
        path: /tmp/smartdns-package/

    - name: 安装 MIPS 工具链 + Rust
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install -qq \
          gcc-mipsel-linux-gnu g++-mipsel-linux-gnu \
          libc6-dev-mipsel-cross binutils-mipsel-linux-gnu \
          build-essential cmake pkg-config curl wget tar file

        # 安装 Rust 工具链
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        source "$HOME/.cargo/env"

        # ================================================================
        # ★ 重要: Rust 目标必须与你的 Padavan 固件 libc 一致 ★
        # ================================================================
        # 选项 A: glibc (大多数 Padavan 固件, 匹配 mipsel-linux-gnu-gcc)
        rustup target add mipsel-unknown-linux-gnu
        RUST_TARGET=mipsel-unknown-linux-gnu

        # 选项 B: musl (部分 musl-based Padavan, 需要额外的 musl 工具链)
        # rustup target add mipsel-unknown-linux-musl
        # RUST_TARGET=mipsel-unknown-linux-musl

        echo "RUST_TARGET=${RUST_TARGET}" >> $GITHUB_ENV

        # 安装 bindgen-cli (生成 Rust-C 绑定, 用于插件编译时)
        cargo install --force --locked bindgen-cli

        # 验证环境
        echo "=== Rust 环境 ==="
        rustc --version
        cargo --version
        rustup target list | grep mipsel
        which bindgen
        echo "=== 交叉编译器 ==="
        mipsel-linux-gnu-gcc --version | head -1
        mipsel-linux-gnu-gcc -print-sysroot

    - name: 构建 smartdns-ui 插件
      run: |
        export OPENSSL=/tmp/openssl-package/openssl-mipsel
        export PATH="$HOME/.cargo/bin:$PATH"
        export CARGO_BUILD_TARGET=${RUST_TARGET}
        export CC=mipsel-linux-gnu-gcc
        export AR=mipsel-linux-gnu-ar

        # 确保 libsmartdns-test.a 在正确位置
        mkdir -p /tmp/smartdns-Release48.4/src
        cp /tmp/smartdns-package/libsmartdns-test.a /tmp/smartdns-Release48.4/src/ 2>/dev/null || true

        cd /tmp
        if [ ! -d smartdns-Release48.4 ]; then
          curl -sL -o smartdns-Release48.4.tar.gz \
            "https://codeload.github.com/pymumu/smartdns/tar.gz/refs/tags/Release48.4"
          tar zxf smartdns-Release48.4.tar.gz
        fi

        # 重新放置 libsmartdns-test.a 到 src 目录 (插件构建时需要)
        cp /tmp/smartdns-package/libsmartdns-test.a /tmp/smartdns-Release48.4/src/

        cd /tmp/smartdns-Release48.4/plugin/smartdns-ui

        # 设置 bindgen 查找的 C 头文件路径 (用于生成 Rust 绑定)
        SYSROOT=$(mipsel-linux-gnu-gcc -print-sysroot)
        echo "sysroot: $SYSROOT"
        export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=${SYSROOT} -I${OPENSSL}/include"

        echo "=== 开始编译 smartdns-ui 插件 ==="
        echo "CARGO_BUILD_TARGET=${CARGO_BUILD_TARGET}"
        echo "CC=${CC}"
        echo "AR=${AR}"

        # 编译插件 (使用 build-release feature)
        # 默认带 HTTPS 支持 (通过 rustls), 适合完整 WebUI 功能
        make all

        # 如果不需要 HTTPS (减小体积), 取消下面注释:
        # unset BINDGEN_EXTRA_CLANG_ARGS
        # CARGO_BUILD_ARGS="--no-default-features --features build-release" make all

        echo "=== smartdns-ui 插件构建产物 ==="
        file target/smartdns_ui.so
        ls -la target/smartdns_ui.so

        # 验证是否为 MIPS 架构
        echo "=== ELF 头信息 ==="
        readelf -h target/smartdns_ui.so 2>/dev/null || \
          mipsel-linux-gnu-readelf -h target/smartdns_ui.so 2>/dev/null || true
        echo "=== 共享库依赖 ==="
        readelf -d target/smartdns_ui.so 2>/dev/null | head -20 || \
          mipsel-linux-gnu-readelf -d target/smartdns_ui.so 2>/dev/null | head -20 || true

        # 打包
        mkdir -p /tmp/smartdns-ui-package
        cp target/smartdns_ui.so /tmp/smartdns-ui-package/

    - name: 上传 smartdns-ui 产物
      id: upload
      uses: actions/upload-artifact@master
      with:
        name: smartdns-ui-mipsel-Release48.4
        path: /tmp/smartdns-ui-package/
        retention-days: 7

  # ============================================================
  # Job 4: 构建 smartdns-webui 前端 (Next.js)
  # ============================================================
  build-webui:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact }}

    steps:
    - name: 安装 Node.js 20
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | \
          sudo gpg --dearmor -o /usr/share/keyrings/nodesource-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/nodesource-archive-keyring.gpg] https://deb.nodesource.com/node_20.x nodistro main" | \
          sudo tee /etc/apt/sources.list.d/nodesource.list
        sudo apt-get update
        sudo apt-get install -y nodejs

        echo "=== Node.js 版本 ==="
        node --version
        npm --version

    - name: 构建 smartdns-webui v1.0.0
      run: |
        cd /tmp
        git clone --depth 1 --branch v1.0.0 https://github.com/pymumu/smartdns-webui.git
        cd smartdns-webui

        echo "=== 安装依赖 ==="
        npm install

        echo "=== 构建前端 ==="
        npm run build

        echo "=== WebUI 构建产物 ==="
        ls -la out/
        find out/ -type f | wc -l
        du -sh out/

        # 打包
        mkdir -p /tmp/smartdns-webui-package
        cp -r out /tmp/smartdns-webui-package/

    - name: 上传 WebUI 产物
      id: upload
      uses: actions/upload-artifact@master
      with:
        name: smartdns-webui-v1.0.0
        path: /tmp/smartdns-webui-package/
        retention-days: 7

  # ============================================================
  # Job 5: 组装最终发布包
  # ============================================================
  package:
    runs-on: ubuntu-latest
    needs: [build-smartdns, build-smartdns-ui, build-webui]
    steps:
    - name: 下载所有构建产物
      uses: actions/download-artifact@master
      with:
        path: /tmp/artifacts/

    - name: 组装最终包
      run: |
        cd /tmp

        # 创建目录结构 (对应 Padavan 固件中的路径)
        mkdir -p /tmp/final-package/bin
        mkdir -p /tmp/final-package/lib
        mkdir -p /tmp/final-package/wwwroot
        mkdir -p /tmp/final-package/etc/smartdns

        # 主程序
        cp /tmp/artifacts/smartdns-mipsel-Release48.4/smartdns /tmp/final-package/bin/

        # WebUI Rust 插件
        cp /tmp/artifacts/smartdns-ui-mipsel-Release48.4/smartdns_ui.so /tmp/final-package/lib/

        # WebUI 前端静态资源
        cp -r /tmp/artifacts/smartdns-webui-v1.0.0/out/* /tmp/final-package/wwwroot/

        # 生成 Padavan 专用 smartdns.conf
        cat > /tmp/final-package/etc/smartdns/smartdns.conf << 'CONFEOF'
# ============================================================
# SmartDNS + WebUI for Padavan (红米 AC2100 / MT7621)
# Release48.4 · WebUI v1.0.0 · OpenSSL 3.4.0
# ============================================================

server-name smartdns
bind []:53
cache-size 4096
prefetch-domain yes
serve-expired no
log-level info
log-file /tmp/smartdns.log
log-size 64k
log-num 1

# ---------- WebUI 插件配置 ----------
# 加载 WebUI 后端插件 (通过 dlopen)
plugin /usr/lib/smartdns_ui.so

# WebUI 前端静态资源路径
smartdns-ui.www-root /usr/share/smartdns/wwwroot

# WebUI 监听地址 (Padavan 内网管理 IP, 建议 :6080)
smartdns-ui.ip :6080

# WebUI 登录凭据 (首次使用请修改!)
smartdns-ui.user admin
smartdns-ui.password admin

# 令牌有效期 (秒)
smartdns-ui.token-expire 3600

# CORS (Padavan 本地使用, 建议设为 no)
smartdns-ui.enable-cors no

# ---------- 上游 DNS 服务器 ----------
# 国内
server 223.5.5.5
server 119.29.29.29
server 114.114.114.114
server 202.96.134.133

# 加密 DNS
server-https https://1.12.12.12/dns-query
server-tls 185.222.222.222:853

# ---------- DHCP 租约同步 ----------
dnsmasq-lease-file /tmp/dnsmasq.leases
CONFEOF

        # 生成部署说明
        cat > /tmp/final-package/README.md << 'MDEOF'
# SmartDNS + WebUI for Padavan

## 版本信息
- SmartDNS: Release48.4 (静态链接 OpenSSL 3.4.0)
- SmartDNS-UI (Rust): v1.0.0
- SmartDNS-WebUI (前端): v1.0.0
- 目标架构: mipsel (MT7621 / MT7620 / MT7628)

## 目录结构
```
bin/smartdns              # SmartDNS 主程序
lib/smartdns_ui.so        # WebUI Rust 后端插件
wwwroot/                  # WebUI 前端静态资源 (Next.js build)
etc/smartdns/smartdns.conf # 配置文件模板
```

## Padavan 固件集成

### 1. 固件内嵌 (推荐)
将以下文件放入 Padavan 源码 `trunk/user/` 对应目录:
- `bin/smartdns` → `trunk/user/smartdns/`
- `lib/smartdns_ui.so` → `trunk/user/smartdns/` 或系统库路径
- `wwwroot/` → `trunk/user/smartdns/wwwroot/`

在 `configs/templates/<your_device>.config` 中确保:
```
CONFIG_FIRMWARE_INCLUDE_SMARTDNS=y
```

### 2. 运行时部署 (Entware / 脚本)
如果固件未内置, 可通过启动脚本部署:

```sh
#!/bin/sh
# Padavan - 路由器启动后执行
mkdir -p /usr/share/smartdns
mkdir -p /usr/lib

# 复制文件 (假设放在 /opt/ 下)
cp /opt/bin/smartdns /usr/bin/
cp /opt/lib/smartdns_ui.so /usr/lib/
cp -r /opt/wwwroot /usr/share/smartdns/
cp /opt/etc/smartdns/smartdns.conf /etc/smartdns/

# 启动 SmartDNS (后台运行)
killall smartdns 2>/dev/null
/usr/bin/smartdns -c /etc/smartdns/smartdns.conf -p /var/run/smartdns.pid &
```

### 3. WebUI 访问
- 地址: `http://<路由器IP>:6080`
- 默认账号: `admin` / `admin`
- 首次登录后请立即修改密码!

### 4. 验证
```sh
# 检查进程
ps | grep smartdns

# 检查 WebUI 端口
netstat -lntp | grep 6080

# 测试 WebUI API
curl http://127.0.0.1:6080/api/server/version
```

## 注意事项
1. smartdns_ui.so 是动态库, 必须与 smartdns 主程序的 libc 兼容
2. 如果使用 musl libc, 插件编译目标应为 mipsel-unknown-linux-musl
3. 如果使用 glibc, 应为 mipsel-unknown-linux-gnu
4. 插件通过 dlopen() 加载, 路径必须与 smartdns.conf 中的 plugin 指令一致
5. wwwroot 目录路径必须与 smartdns-ui.www-root 配置一致
MDEOF

        # 打包最终产物
        tar czf smartdns-padavan-Release48.4-webui.tar.gz \
          bin/ lib/ wwwroot/ etc/ README.md

        echo "=== 最终包结构 ==="
        find /tmp/final-package -type f | sort
        echo ""
        echo "=== 文件大小 ==="
        du -sh /tmp/final-package/smartdns-padavan-Release48.4-webui.tar.gz
        ls -lh /tmp/final-package/smartdns-padavan-Release48.4-webui.tar.gz

    - name: 上传最终发布包
      uses: actions/upload-artifact@master
      with:
        name: smartdns-padavan-Release48.4-webui
        path: /tmp/final-package/smartdns-padavan-Release48.4-webui.tar.gz
        retention-days: 30
